name: Validate Cloudflare staging

on:
  push:
    branches: [cloudflare-d1-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check src/index.js
      - name: Check migration files exist
        run: |
          test -s migrations/0001_initial_catalog.sql
          test -s migrations/0002_seed_initial_catalog.sql
          test -s wrangler.jsonc
          test -s public/index.html
