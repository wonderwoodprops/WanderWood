<!doctype html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול WanderWood</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--brown:#3d2b1f;--gold:#bc986a;--cream:#fcfaf7;--line:#eadfd2;--muted:#806b59}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:Assistant,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}
.login-card{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 8px 24px #3d2b1f0b}.login-card h2{margin-bottom:8px}.login-card form{margin-top:18px}.login-error{color:#9b3325;min-height:22px;font-size:14px}
h1{font-size:24px;margin:0}h2{font-size:21px;margin:0 0 16px}.sub{color:var(--muted);font-size:14px}
main{max-width:1120px;margin:28px auto;padding:0 18px}.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 16px;font:600 16px Assistant;cursor:pointer;background:#eee5da;color:var(--brown)}
button.primary{background:var(--brown);color:#fff}button.gold{background:var(--gold);color:#fff}button.danger{background:#f8e5e1;color:#8a2c1b}button:disabled{opacity:.5;cursor:wait}
.tab.active{background:var(--brown);color:white}.panel,.editor{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px #3d2b1f0b}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.items{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center}
.item img{width:76px;height:76px;object-fit:cover;border-radius:9px;background:#f4eee7}.item h3{font-size:17px;margin:0 0 4px}.item p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap}
form{display:grid;gap:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:5px;font-weight:600}input,textarea{width:100%;border:1px solid #d9cbbb;border-radius:9px;padding:11px;font:16px Assistant;color:var(--brown);background:#fff}textarea{min-height:100px;resize:vertical}
.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
#notice{position:fixed;bottom:18px;left:18px;z-index:10;background:var(--brown);color:white;padding:12px 18px;border-radius:10px;display:none;max-width:90vw}
.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:650px){header{padding:14px 16px}h1{font-size:20px}.item{grid-template-columns:60px 1fr}.item img{width:60px;height:60px}.actions{grid-column:1/-1}.grid{grid-template-columns:1fr}.panel,.editor{padding:14px}}
</style></head><body>
<section id="login-screen" class="login-card">
<h2>כניסה לניהול</h2><div class="sub">יש להזין סיסמת מנהל בת 8 תווים.</div>
<form id="login-form"><label>סיסמת מנהל<input id="admin-password" type="password" minlength="8" maxlength="8" autocomplete="current-password" required></label>
<div id="login-error" class="login-error" role="alert"></div><button class="primary" type="submit">כניסה</button></form>
</section>
<div id="admin-content" class="hidden">
<header><div><h1>WanderWood · ניהול</h1><div class="sub" id="identity">ממשק ניהול</div></div><div class="actions"><button id="logout" class="hidden">יציאה</button><a href="/" style="color:var(--brown)">מעבר לאתר</a></div></header>
<main>
<div class="tabs"><button class="tab active" data-tab="products">מוצרים</button><button class="tab" data-tab="testimonials">המלצות</button></div>
<section id="products-panel" class="panel"><div class="toolbar"><div><h2>מוצרים</h2><div class="sub">השינויים נשמרים מיד באתר הפיתוח.</div></div><button class="primary" id="add-product">+ מוצר חדש</button></div><div id="products-list" class="items"><div class="empty">טוען מוצרים…</div></div></section>
<section id="testimonials-panel" class="panel hidden"><div class="toolbar"><div><h2>המלצות לקוחות</h2><div class="sub">אפשר להוסיף, לערוך ולהסתיר המלצות.</div></div><button class="primary" id="add-testimonial">+ המלצה חדשה</button></div><div id="testimonials-list" class="items"><div class="empty">טוען המלצות…</div></div></section>
<section id="editor" class="editor hidden" style="margin-top:20px"><div class="toolbar"><h2 id="editor-title">עריכת פריט</h2><button id="close-editor">סגירה</button></div>
<form id="edit-form">
<div id="product-fields"><div class="grid"><label>שם המוצר<input name="product_name" required maxlength="180"></label><label>מחיר בש״ח<input name="product_price" type="number" min="0" step="1" required></label></div>
<label>תיאור<textarea name="product_description" maxlength="5000"></textarea></label><label>קישורי תמונות (קישור אחד בכל שורה)<textarea name="product_images" placeholder="https://..."></textarea></label>
<label>העלאת תמונה לשרת<input class="image-file" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="sub">לאחר בחירת תמונה היא תועלה לאחסון ותתווסף לרשימת הקישורים.</div>
<label class="check"><input name="product_is_active" type="checkbox" checked> המוצר מוצג באתר</label></div>
<div id="testimonial-fields" class="hidden"><div class="grid"><label>שם הלקוח/ה<input name="testimonial_name" required maxlength="180"></label><label>פרטי זיהוי / עסק<input name="contact" maxlength="180"></label></div>
<label>תוכן ההמלצה<textarea name="content" required maxlength="5000"></textarea></label><label>קישורי תמונות (קישור אחד בכל שורה)<textarea name="testimonial_images" placeholder="https://..."></textarea></label><label>העלאת תמונה לשרת<input class="image-file" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="check"><input name="testimonial_is_active" type="checkbox" checked> ההמלצה מוצגת באתר</label></div>
<div class="form-actions"><button class="primary" type="submit">שמירת שינויים</button><button type="button" id="cancel-edit">ביטול</button></div></form></section>
</main></div><div id="notice" role="status"></div>
<script>
const $=s=>document.querySelector(s);let products=[],testimonials=[],mode='products',editingId=null;
function notice(m){const n=$('#notice');n.textContent=m;n.style.display='block';clearTimeout(notice.timer);notice.timer=setTimeout(()=>n.style.display='none',3500)}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'הפעולה נכשלה');return d}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showTab(tab){mode=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#products-panel').classList.toggle('hidden',tab!=='products');$('#testimonials-panel').classList.toggle('hidden',tab!=='testimonials');closeEditor()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
async function load(){[products,testimonials]=await Promise.all([api('/api/admin/products'),api('/api/admin/testimonials')]);render()}
async function startAdmin(){await api('/api/admin/session');$('#login-screen').classList.add('hidden');$('#admin-content').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#identity').textContent='מחובר/ת כמנהל';await load()}
function render(){renderList('products',products);renderList('testimonials',testimonials)}
function renderList(kind,items){const host=$('#'+kind+'-list');if(!items.length){host.innerHTML='<div class="empty">אין פריטים להצגה.</div>';return}
host.innerHTML=items.map(x=>'<article class="item"><img src="'+esc((x.images||[])[0]||'')+'" alt="" onerror="this.style.visibility=\'hidden\'"><div><h3>'+esc(x.name)+'</h3><p>'+(kind==='products'?'₪'+Number(x.price||0):esc(x.contact||''))+' · '+(x.is_active?'מוצג באתר':'מוסתר')+'</p></div><div class="actions"><button data-edit="'+esc(x.id)+'">עריכה</button><button class="'+(x.is_active?'danger':'gold')+'" data-toggle="'+esc(x.id)+'">'+(x.is_active?'הסתרה':'הצגה')+'</button></div></article>').join('');
host.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(kind,b.dataset.edit));host.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleItem(kind,b.dataset.toggle))}
function openEditor(kind,id=null){mode=kind;editingId=id;const item=(kind==='products'?products:testimonials).find(x=>x.id===id)||{};$('#editor').classList.remove('hidden');$('#editor-title').textContent=(id?'עריכת ':'הוספת ')+(kind==='products'?'מוצר':'המלצה');$('#product-fields').classList.toggle('hidden',kind!=='products');$('#testimonial-fields').classList.toggle('hidden',kind!=='testimonials');const f=$('#edit-form');f.reset();const prefix=kind==='products'?'product':'testimonial';f.elements[prefix+'_name'].value=item.name||'';f.elements[prefix+'_is_active'].checked=item.is_active!==false&&item.is_active!==0;f.elements[prefix+'_images'].value=(item.images||[]).join('\n');if(kind==='products'){f.elements.product_price.value=item.price??'';f.elements.product_description.value=item.description||''}else{f.elements.contact.value=item.contact||'';f.elements.content.value=item.content||''}document.querySelectorAll('.image-file').forEach(input=>input.value='');$('#editor').scrollIntoView({behavior:'smooth'})}
function closeEditor(){$('#editor').classList.add('hidden');editingId=null}
$('#add-product').onclick=()=>openEditor('products');$('#add-testimonial').onclick=()=>openEditor('testimonials');$('#close-editor').onclick=closeEditor;$('#cancel-edit').onclick=closeEditor;
document.querySelectorAll('.image-file').forEach(input=>input.onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const fd=new FormData();fd.append('image',file);const r=await fetch('/api/admin/uploads',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'העלאה נכשלה');const field=$('#edit-form').elements[mode==='products'?'product_images':'testimonial_images'];field.value=(field.value.trim()?field.value.trim()+'\n':'')+d.url;notice('התמונה הועלתה ונוספה לרשימה')}catch(err){notice(err.message)}finally{e.target.value=''}});
$('#edit-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const prefix=mode==='products'?'product':'testimonial';const body={name:f.elements[prefix+'_name'].value.trim(),images:f.elements[prefix+'_images'].value.split('\n').map(s=>s.trim()).filter(Boolean),is_active:f.elements[prefix+'_is_active'].checked};if(mode==='products'){body.price=Number(f.elements.product_price.value);body.description=f.elements.product_description.value.trim()}else{body.contact=f.elements.contact.value.trim();body.content=f.elements.content.value.trim()}try{await api('/api/admin/'+mode+(editingId?'/'+encodeURIComponent(editingId):''),{method:editingId?'PUT':'POST',body:JSON.stringify(body)});notice('השינויים נשמרו');closeEditor();await load()}catch(err){notice(err.message)}};
async function toggleItem(kind,id){const item=(kind==='products'?products:testimonials).find(x=>x.id===id);try{await api('/api/admin/'+kind+'/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({...item,is_active:!item.is_active})});await load();notice(item.is_active?'הפריט הוסתר':'הפריט הוצג באתר')}catch(e){notice(e.message)}}
$('#login-form').onsubmit=async e=>{e.preventDefault();$('#login-error').textContent='';const button=e.currentTarget.querySelector('button[type="submit"]');button.disabled=true;try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#admin-password').value})});$('#admin-password').value='';await startAdmin()}catch(err){$('#login-error').textContent=err.message}finally{button.disabled=false}};
$('#logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch{}$('#admin-content').classList.add('hidden');$('#login-screen').classList.remove('hidden');$('#logout').classList.add('hidden');$('#identity').textContent='ממשק ניהול'};
startAdmin().catch(e=>{if(e.message!=='נדרשת התחברות.'&&!e.message.includes('ההתחברות פגה'))notice(e.message)});
</script></body></html>
